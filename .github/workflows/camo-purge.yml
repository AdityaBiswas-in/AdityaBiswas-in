name: Purge GitHub Profile Camo Cache

on:
  schedule:
    # Run every 6 hours automatically to ensure stats stay refreshed
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
  # Allows you to manually trigger an immediate refresh from the GitHub Actions tab anytime!
  workflow_dispatch:

jobs:
  purge-camo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Purge GitHub Camo Cache
        uses: kevincobain2000/action-camo-purge@v1
