<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080E"/>
      <stop offset="50%" stop-color="#0D111A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Top Border Accent Gradient -->
    <linearGradient id="footerTopLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#00F7FF"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="footerGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter -->
    <filter id="glowFtr" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      20% { transform: scale(1.3); }
      40% { transform: scale(1); }
      60% { transform: scale(1.2); }
      80% { transform: scale(1); }
    }
    .heart-pulse {
      display: inline-block;
      transform-origin: center;
      animation: pulseHeart 2s infinite ease-in-out;
    }

    @keyframes orbTravel {
      0%, 100% { transform: translateX(-180px); opacity: 0.3; }
      50% { transform: translateX(180px); opacity: 1; }
    }
    .travel-dot {
      animation: orbTravel 6s ease-in-out infinite alternate;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="120" rx="14" fill="url(#footerBg)"/>

  <!-- Subtle Radial Glow at the Top -->
  <rect width="1200" height="120" rx="14" fill="url(#footerGlow)"/>

  <!-- Accent Top Line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#footerTopLine)"/>

  <!-- Center Glowing Accent Dot with subtle horizontal sweep -->
  <g class="travel-dot">
    <circle cx="600" cy="1" r="5" fill="#00F7FF" filter="url(#glowFtr)"/>
    <circle cx="600" cy="1" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Footer Content -->
  <g transform="translate(600, 52)">
    <text x="0" y="0" text-anchor="middle" class="sans" font-size="14.5" font-weight="600" fill="#E2E8F0" letter-spacing="1">
      ✨ THANKS FOR VISITING MY PROFILE ✨
    </text>
  </g>

  <g transform="translate(600, 84)">
    <text x="0" y="0" text-anchor="middle" class="mono" font-size="12" fill="#64748B" letter-spacing="1">
      Designed with <tspan fill="#EF4444" class="heart-pulse">❤</tspan> &amp; code by <tspan fill="#00F7FF" font-weight="600">Aditya Biswas</tspan> • Let's build something awesome together
    </text>
  </g>

  <!-- Decorative Corner Accents -->
  <path d="M 20 20 L 20 12 L 28 12" fill="none" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M 1180 20 L 1180 12 L 1172 12" fill="none" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M 20 100 L 20 108 L 28 108" fill="none" stroke="#8B5CF6" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M 1180 100 L 1180 108 L 1172 108" fill="none" stroke="#8B5CF6" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

</svg>
